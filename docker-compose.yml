services:
  postgres:
    image: postgres:16-alpine
    container_name: library_postgres
    environment:
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: "666"
      POSTGRES_DB: library
    ports:
      - "5432:5432"
    volumes:
      - library_pgdata:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  library_pgdata:
